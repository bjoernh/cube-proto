[package]
name = "cube-proto"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Wire-protocol types (JSON requests/responses/events) and shared error types for cubed and cubectl."

[lints]
workspace = true

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
proptest = "1"
serde_test = "1"
