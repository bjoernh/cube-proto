[package]
name = "cube-proto"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Wire-protocol types (JSON requests, responses, events) and shared error types for the LED Cube 2.0 control plane."
readme = "README.md"
keywords = ["led-cube", "protocol", "serde", "wire-format"]
categories = ["data-structures", "encoding"]

[lints]
workspace = true

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
proptest = "1"
serde_test = "1"
