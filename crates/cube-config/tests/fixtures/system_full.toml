[display]
# DRM device selection. /dev/dri/cardN numbering is not stable on Pi
# (VC4 HDMI + cube driver + vkms + render nodes can re-order across boots).
# cubed enumerates DRM devices and picks the one whose driver name matches
# `drm_driver` and that exposes a connector matching `connector`.
drm_driver  = "cube-fpga-rpispi"   # for dev: "vkms"
connector   = "Cube-1"             # for dev: "Writeback-1" or similar
mode        = "384x64@60"          # parsed and verified against modes the driver exposes

refresh_hz   = 60
spi_clock_hz = 35_000_000
# bitstream compatibility range is compiled into the driver, not configurable here;
# shown for documentation. The driver refuses probe on any version outside [min, max].
# bitstream_min_version = 1
# bitstream_max_version = 1

[remote_render]
enabled = true
bind = "127.0.0.1"
port = 2017
mtu_hint = "jumbo_recommended"

[input]
# Pattern matched against evdev device NAME via udev monitor.
# Wildcards: shell-style globs.
system_controller_name_pattern = "8BitDo*"
# Reserved keys in CANONICAL button terms (cube-gamepad spec); Player 1 only.
key_back   = "Select"
key_home   = "Start"
key_power  = "Guide"

[imu]
xy_rotation_deg = 0.0
xz_rotation_deg = 45.0
yz_rotation_deg = 0.0

[transitions]
mode = "hard_cut"                 # v1: hard_cut only

[power]
idle_blank_after_sec = 0          # 0 = disabled. Only applies while launcher is focused (§5.12).
