[package]
name = "cube-presets"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Preset TOML I/O for LED Cube 2.0 with flock-protected atomic writes and fsync ordering."
readme = "README.md"
keywords = ["led-cube", "presets", "toml"]
categories = ["filesystem", "config"]

[lints]
workspace = true

[dependencies]
cube-proto = { path = "../cube-proto", version = "0.2.0" }
cube-config = { path = "../cube-config", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
nix = { version = "0.29", features = ["fs"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["serde", "now"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
nix = { version = "0.29", features = ["fs"] }
