[package]
name = "cube-admin-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Async JSON-Lines client for the LED Cube 2.0 daemon's admin socket: handshake, request/response demux and event subscriptions."
readme = "README.md"
keywords = ["led-cube", "client", "tokio"]
categories = ["network-programming", "asynchronous"]

[lints]
workspace = true

[lib]
name = "cube_admin_client"
path = "src/lib.rs"

[dependencies]
cube-proto = { path = "../cube-proto", version = "0.2.0" }
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync", "test-util"] }
tempfile = "3"
